name: yamtrack-dev
services:
  db:
    image: postgres:16-alpine
    container_name: yamtrack-dev-db
    environment:
      - POSTGRES_DB=yamtrack
      - POSTGRES_USER=yamtrack
      - POSTGRES_PASSWORD=yamtrack
    ports:
      - "5433:5432"

  redis:
    image: redis:8-alpine
    container_name: yamtrack-dev-redis
    ports:
      - "6380:6379"
