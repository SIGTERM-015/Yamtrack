{% extends "base.html" %}

{% block title %}
  Create group - Yamtrack
{% endblock title %}

{% block content %}
  <div class="mb-8">
    <h1 class="text-3xl font-bold mb-2">Create group</h1>
    <p class="text-gray-400">Start a group and invite other users of this instance</p>
  </div>

  {% if error %}
    <div class="mb-4 rounded-lg bg-red-900/40 border border-red-700 px-4 py-3 text-red-200">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="{% url 'group_create' %}" class="max-w-xl space-y-4">
    {% csrf_token %}
    <div>
      <label for="name" class="block text-sm font-medium mb-1">Name</label>
      <input id="name" name="name" type="text" value="{{ name|default:'' }}" maxlength="255"
             class="w-full rounded-lg bg-[#2a2f35] border border-[#39404b] px-3 py-2 text-white"
             required>
    </div>
    <div>
      <label for="description" class="block text-sm font-medium mb-1">Description</label>
      <textarea id="description" name="description" rows="3"
                class="w-full rounded-lg bg-[#2a2f35] border border-[#39404b] px-3 py-2 text-white">{{ description|default:'' }}</textarea>
    </div>
    <div class="flex gap-3">
      <button type="submit"
              class="rounded-lg bg-[#4f46e5] px-4 py-2 font-medium text-white hover:bg-[#4338ca]">
        Create group
      </button>
      <a href="{% url 'group_list' %}"
         class="rounded-lg border border-[#39404b] px-4 py-2 font-medium text-gray-300 hover:bg-[#2a2f35]">
        Cancel
      </a>
    </div>
  </form>
{% endblock content %}
