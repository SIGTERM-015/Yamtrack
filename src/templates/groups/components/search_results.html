{% if query %}
  {% if results %}
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
      {% for row in results %}
        <div class="bg-[#1e2329] rounded-lg overflow-hidden">
          <img alt="{{ row.item.title }}"
               class="w-full aspect-[2/3] object-cover bg-[#3e454d]"
               src="{% if row.item.image and row.item.image != 'None' %}{{ row.item.image }}{% else %}{{ IMG_NONE }}{% endif %}">
          <div class="p-2">
            <p class="text-xs font-medium text-white line-clamp-2 mb-1.5" title="{{ row.item.title }}">
              {{ row.item.title }}
            </p>
            {% if row.already_added %}
              {% include "groups/components/added_badge.html" with item=row.item %}
            {% else %}
              <button type="button"
                      id="group-add-{{ row.item.id }}"
                      class="w-full text-xs bg-indigo-600 hover:bg-indigo-700 text-white rounded-md py-1 cursor-pointer transition-colors"
                      hx-post="{% url 'group_item_add' group.id %}"
                      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                      hx-vals='{"item_id": "{{ row.item.id }}"}'
                      hx-target="#group-item-grid"
                      hx-swap="outerHTML">
                Add
              </button>
            {% endif %}
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-xs text-gray-500">No results for "{{ query }}".</p>
  {% endif %}
{% endif %}
