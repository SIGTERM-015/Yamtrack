<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#181a1b">
    <title>Offline - Magpie</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #212529; color: #f3f4f6; font-family: system-ui, sans-serif; text-align: center; padding: 1rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #9ca3af; margin: 0 0 1.5rem; }
      button { background: #4f46e5; color: #fff; border: 0; border-radius: .375rem; padding: .5rem 1rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Magpie needs a connection to load your library.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
